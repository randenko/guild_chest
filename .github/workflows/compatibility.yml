name: Valheim compatibility

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: valheim-compatibility
  cancel-in-progress: false

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.local/nuget
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

defaults:
  run:
    shell: bash

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/devcontainers/dotnet:2-10.0-noble@sha256:9eb314432a5fa67773a53ab754cdc381cae614906162f9fc44cdb7f7837b91c7
      options: --user 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Validate against fresh game references
        run: dotnet run --project build --configuration Release --no-build --no-restore -- --target Compatibility --test-logger 'trx;LogFileName=tests.trx' --test-results-directory "$GITHUB_WORKSPACE/TestResults" 2>&1 | tee artifacts/compatibility.log
      - name: Upload compatibility diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compatibility-diagnostics
          overwrite: true
          path: |
            TestResults/
            artifacts/*.log
            .local/references.json
          include-hidden-files: true
          retention-days: 14
