name: Nexus Mods

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published stable release tag (vX.Y.Z)
        required: true
        type: string
      preflight_only:
        description: Validate without publishing (v1.1.0 is always read-only)
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: nexusmods-guildchest
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.NEXUSMODS_PUBLISH_ENABLED == 'true' &&
       !github.event.release.draft && !github.event.release.prerelease &&
       github.event.release.tag_name != 'v1.1.0')
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
      NEXUSMODS_MOD_ID: ${{ vars.NEXUSMODS_MOD_ID }}
      NEXUSMODS_FILE_ID: ${{ vars.NEXUSMODS_FILE_ID }}
      NEXUSMODS_MOD_PAGE_ID: ${{ vars.NEXUSMODS_MOD_PAGE_ID }}
      NEXUSMODS_PUBLISH_ENABLED: ${{ vars.NEXUSMODS_PUBLISH_ENABLED }}
      NEXUSMODS_API_KEY: ${{ secrets.NEXUSMODS_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Require configured API key
        run: |
          if [[ -z "$NEXUSMODS_API_KEY" ]]; then
            echo 'NEXUSMODS_API_KEY is missing.' >&2
            exit 1
          fi
      - name: Read-only preflight
        run: python3 scripts/publish_nexusmods.py "$RELEASE_TAG" --preflight
      - name: Prepare verified release assets
        id: prepare
        if: github.event_name == 'release' || !inputs.preflight_only
        run: python3 scripts/publish_nexusmods.py "$RELEASE_TAG" --prepare --directory "$RUNNER_TEMP/nexusmods"
      # Durable intent markers stop a retry from repeating an ambiguous write.
      - name: Record file upload intent
        if: steps.prepare.outputs.upload_needed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.prepare.outputs.file_intent }}
          path: ${{ runner.temp }}/nexusmods/file-intent.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload exact release ZIP with official Nexus action
        id: upload
        if: steps.prepare.outputs.upload_needed == 'true'
        continue-on-error: true
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2 # v1.0.0-beta.11
        with:
          api_key: ${{ secrets.NEXUSMODS_API_KEY }}
          file_id: ${{ vars.NEXUSMODS_FILE_ID }}
          filename: ${{ steps.prepare.outputs.filename }}
          version: ${{ steps.prepare.outputs.version }}
          display_name: Guild Chest ${{ steps.prepare.outputs.version }}
          description: ${{ steps.prepare.outputs.description }}
          category: main
          archive_existing_version: 'true'
          primary_mod_manager_download: 'true'
          allow_mod_manager_download: 'true'
          show_requirements_pop_up: 'true'
          update_mod_version: 'true'
      - name: Reconcile uploaded file even if its response was lost
        id: verify
        if: >-
          !cancelled() && steps.prepare.outcome == 'success' &&
          (github.event_name == 'release' || !inputs.preflight_only)
        run: python3 scripts/publish_nexusmods.py "$RELEASE_TAG" --verify --directory "$RUNNER_TEMP/nexusmods"
      - name: Record changelog append intent
        if: steps.verify.outputs.notes_needed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.verify.outputs.notes_intent }}
          path: ${{ runner.temp }}/nexusmods/notes-intent.json
          if-no-files-found: error
          retention-days: 90
      - name: Preserve file requirements and complete changelog
        if: steps.verify.outcome == 'success'
        run: python3 scripts/publish_nexusmods.py "$RELEASE_TAG" --finalize --directory "$RUNNER_TEMP/nexusmods"
