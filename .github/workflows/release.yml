name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.local/nuget
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

defaults:
  run:
    shell: bash

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/devcontainers/dotnet:2-10.0-noble@sha256:9eb314432a5fa67773a53ab754cdc381cae614906162f9fc44cdb7f7837b91c7
      options: --user 0
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          cache-nuget: 'false'
      - name: Validate release tag and commit
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 scripts/check_release.py "$RELEASE_TAG")
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Restore tests
        run: dotnet restore tests/GuildChest.Tests/GuildChest.Tests.csproj --locked-mode
      - name: Run tests
        run: bash scripts/dev.sh test --no-restore --logger 'trx;LogFileName=tests.trx' --results-directory "$GITHUB_WORKSPACE/TestResults" 2>&1 | tee artifacts/tests.log
      - name: Download fresh game references
        run: bash scripts/dev.sh setup --update 2>&1 | tee artifacts/setup.log
      - name: Restore solution
        run: dotnet restore GuildChest.sln --locked-mode
      - name: Build Debug
        run: bash scripts/dev.sh build --no-restore 2>&1 | tee artifacts/debug-build.log
      - name: Package Release
        run: bash scripts/dev.sh package --no-restore 2>&1 | tee artifacts/package.log
      - name: Calculate checksum
        working-directory: artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: sha256sum "GuildChest-$VERSION.zip" > "GuildChest-$VERSION.zip.sha256"
      - name: Upload validated release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-assets
          overwrite: true
          path: |
            artifacts/GuildChest-*.zip
            artifacts/GuildChest-*.zip.sha256
          if-no-files-found: error
          retention-days: 14
      - name: Upload validation diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-diagnostics
          overwrite: true
          path: |
            TestResults/
            artifacts/*.log
            .local/references.json
          include-hidden-files: true
          retention-days: 14

  draft:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download validated release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-assets
          path: artifacts
      - name: Verify checksum
        working-directory: artifacts
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: sha256sum --check "GuildChest-$VERSION.zip.sha256"
      - name: Create or update draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          draft=$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[] | select(.tag_name == env.RELEASE_TAG) | .draft')
          case "$draft" in
            false)
              echo "Release $RELEASE_TAG is already published; refusing to change it." >&2
              exit 1
              ;;
            true)
              gh release upload "$RELEASE_TAG" "artifacts/GuildChest-$VERSION.zip" "artifacts/GuildChest-$VERSION.zip.sha256" --clobber
              ;;
            '')
              gh release create "$RELEASE_TAG" "artifacts/GuildChest-$VERSION.zip" "artifacts/GuildChest-$VERSION.zip.sha256" --draft --verify-tag --generate-notes --title "Guild Chest $VERSION"
              ;;
            *)
              echo "Unexpected release lookup result: $draft" >&2
              exit 1
              ;;
          esac
