name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NUGET_PACKAGES: ${{ github.workspace }}/.local/nuget
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/devcontainers/dotnet:2-10.0-noble@sha256:9eb314432a5fa67773a53ab754cdc381cae614906162f9fc44cdb7f7837b91c7
      options: --user 0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      - name: Restore tests
        run: dotnet restore tests/GuildChest.Tests/GuildChest.Tests.csproj --locked-mode
      - name: Run tests
        run: bash scripts/dev.sh test --no-restore --logger 'trx;LogFileName=tests.trx' --results-directory "$GITHUB_WORKSPACE/TestResults" 2>&1 | tee artifacts/tests.log
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results
          overwrite: true
          path: |
            TestResults/
            artifacts/tests.log
          retention-days: 14

  build-package:
    name: build-package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/devcontainers/dotnet:2-10.0-noble@sha256:9eb314432a5fa67773a53ab754cdc381cae614906162f9fc44cdb7f7837b91c7
      options: --user 0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
        with:
          references: cached
      - name: Restore solution
        run: dotnet restore GuildChest.sln --locked-mode
      - name: Build Debug
        run: bash scripts/dev.sh build --no-restore 2>&1 | tee artifacts/debug-build.log
      - name: Package Release
        run: bash scripts/dev.sh package --no-restore 2>&1 | tee artifacts/package.log
      - name: Upload installable package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: guild-chest-package
          overwrite: true
          path: artifacts/GuildChest-*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: build-diagnostics
          overwrite: true
          path: |
            artifacts/*.log
            .local/references.json
          include-hidden-files: true
          retention-days: 14
