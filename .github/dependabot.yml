version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ['*']
    open-pull-requests-limit: 5
  - package-ecosystem: nuget
    directories:
      - /src/GuildChest
      - /src/GuildChest.Core
      - /tests/GuildChest.Tests
      - /tests/GuildChest.NativeSmoke
    schedule:
      interval: weekly
      day: monday
    groups:
      nuget:
        patterns: ['*']
    open-pull-requests-limit: 5
