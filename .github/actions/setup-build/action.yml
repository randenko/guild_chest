name: Set up Guild Chest builds
description: Install build tools, restore optional caches, and compile the NUKE runner.
inputs:
  references:
    description: Reference cache mode (none or cached); NUKE targets perform reference setup.
    default: none
  cache-nuget:
    description: Whether to restore and save the NuGet cache.
    default: 'true'
runs:
  using: composite
  steps:
    - name: Install prerequisites
      shell: bash
      run: |
        apt-get update
        apt-get install -y --no-install-recommends lib32gcc-s1 lib32stdc++6 python3 unzip curl ca-certificates zstd
        # Checkout uses a temporary HOME; shell steps need their own trust entry.
        git config --global --add safe.directory "$(pwd -P)"
        mkdir -p artifacts
        dotnet --version
        python3 --version

    - name: Cache NuGet packages
      if: inputs.cache-nuget == 'true'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: ${{ env.NUGET_PACKAGES }}
        key: nuget-v1-${{ runner.os }}-${{ runner.arch }}-9eb314432a5f-${{ hashFiles('global.json', '**/packages.lock.json') }}

    - name: Identify reference cache
      if: inputs.references == 'cached'
      id: reference-cache
      shell: bash
      run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

    - name: Cache game references
      if: inputs.references == 'cached'
      uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
      with:
        path: |
          .local/valheim-server/valheim_server_Data/Managed
          .local/valheim-server/steamapps/appmanifest_896660.acf
          .local/dependencies
        key: references-v1-${{ runner.os }}-${{ runner.arch }}-9eb314432a5f-${{ hashFiles('scripts/setup.py', 'manifest.json') }}-${{ steps.reference-cache.outputs.week }}

    - name: Build NUKE runner
      shell: bash
      run: |
        dotnet restore build/_build.csproj --locked-mode
        dotnet build build/_build.csproj --configuration Release --no-restore
